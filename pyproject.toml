[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adni-x"
version = "0.2.0"
description = "Reproducible ADNI analyses from completed S8b PhiID tensors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "matplotlib>=3.9",
  "seaborn>=0.13", "scikit-learn>=1.5", "h5py>=3.11", "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2"]

[project.scripts]
adni-x = "adni_x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

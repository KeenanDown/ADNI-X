# Replace /path/to placeholders with your local input, cache and output paths.
inputs:
  tensors: /path/to/adni/tensors
  series: /path/to/adni/series
  clinical: /path/to/adni/ADNIMERGE.csv
  freesurfer: /path/to/adni/freesurfer
  atlas: /path/to/resources/atlas232.csv
  resolutions: null
  tensor_variable: PhiIDTensor
  series_variable: ROI_activity
  tensor_axes:
  - 0
  - 1
  - 2
cohort:
  parcels: 232
  estimator: ccs
  time_min: 150
  time_max: 250
  tr_min_seconds: 2.875
  tr_max_seconds: 3.150
  visit: latest
transform:
  tdmi: none
  confounds:
  - sex
  - education
  - visit_age
  - ICV
  missing: complete
  adjustment: mean
  age: visit
  exclude_diagonal: true
  regional_axis: 1
  network_edges: both
  epsilon: 1.0e-12
  block_features: 4096
statistics:
  seed: 42
  resamples: 10000
  permutations: 10000
  alpha: 0.05
  welch: true
  correction: fdr_bh
  test_fraction: 0.25
cache: /path/to/scratch/adni-x/cache
results: /path/to/project/adni-x/results
